# Release pipeline. On a version tag (v*): build the wheel + sdist and a
# standalone Windows .exe, wrap the exe in a one-click Claude Desktop
# Extension (.mcpb), publish to PyPI via trusted publishing, and cut a
# GitHub release with the wheel + exe + .mcpb attached.
#
# One-time setup before the first tag:
#   1. Create the PyPI project's trusted publisher
#      (https://pypi.org/manage/account/publishing/) pointing at this
#      repo + this workflow under the environment name "pypi". No tokens.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build

      # The wheel is what PyPI serves and what `pip install` gives users, yet
      # nothing installed it before publishing: the exe check gates the
      # PyInstaller binary built from source (AB#3142), which is a different
      # artifact with different dependency resolution. A wheel-only fault - a
      # missing packages entry, a bad hatch build glob, an undeclared dependency
      # - would have shipped. publish-pypi needs this job, so a failure here
      # stops the irreversible step. (AB#3143)
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          # Run from outside the repo so the import resolves to the INSTALLED
          # package and can never fall through to ./src.
          cd /tmp
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0.1"}}}'
          OUT=$(echo "$INIT" | timeout 30 /tmp/wheelcheck/bin/python -m modelchoice_mcp 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"serverInfo"' \
            || { echo "::error::installed wheel did not return a serverInfo block"; exit 1; }
          echo "$OUT" | grep -q '"modelchoice-mcp"' \
            || { echo "::error::installed wheel did not identify as modelchoice-mcp"; exit 1; }
          # A tag-driven release must never publish a wheel whose version disagrees
          # with the tag: that mistake costs a PyPI version number permanently.
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(echo "$OUT" | /tmp/wheelcheck/bin/python -c \
            "import sys, json; print(json.loads(sys.stdin.readline())['result']['serverInfo']['version'])") \
            || { echo "::error::could not parse serverInfo from the wheel's initialize response"; exit 1; }
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::wheel reports version $ACTUAL but the tag is $GITHUB_REF_NAME (expected $EXPECTED)"
            exit 1
          fi
          echo "wheel OK: installs clean, answers initialize, reports $ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev for pyinstaller)
        run: uv sync --extra dev

      - name: Build single-file .exe
        run: uv run pyinstaller modelchoice_mcp.spec --clean --noconfirm

      - name: Verify .exe boots and answers MCP initialize
        shell: bash
        run: |
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0.1"}}}'
          OUT=$(echo "$INIT" | timeout 15 ./dist/modelchoice-mcp.exe || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"serverInfo"' || (echo "exe did not return a serverInfo block" && exit 1)
          echo "$OUT" | grep -q '"modelchoice-mcp"' || (echo "exe did not identify as modelchoice-mcp" && exit 1)

      - name: Build .mcpb Desktop Extension
        # Wrap the standalone exe in a one-click Claude Desktop Extension
        # bundle. Version is injected from the tag so it matches the release.
        shell: bash
        run: |
          uv run python scripts/build_mcpb.py dist/modelchoice-mcp.exe "${GITHUB_REF_NAME#v}" dist/modelchoice-mcp.mcpb

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/modelchoice-mcp.exe

      - name: Upload .mcpb Desktop Extension
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/modelchoice-mcp.mcpb

  publish-pypi:
    # Gated on build-windows-exe as well as build, even though it consumes only
    # the `dist` artifact. Publishing to PyPI is the one irreversible step in
    # this workflow - a version number can never be reused - so it must run
    # after every verification, not alongside them. With `needs: build` alone,
    # build-windows-exe raced the publish and a packaging break (its MCP
    # initialize handshake failing) still shipped. Costs a few minutes; buys
    # the ability to fix a bad build by deleting a tag instead of burning a
    # version. (AB#3142)
    needs: [build, build-windows-exe]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts/dist
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows
      - name: Download .mcpb Desktop Extension
        uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle
          path: artifacts/mcpb
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist/*
            artifacts/windows/modelchoice-mcp.exe
            artifacts/mcpb/modelchoice-mcp.mcpb
          generate_release_notes: true
