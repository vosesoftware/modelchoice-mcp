name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # --locked is what stops CI drifting. Without it `uv sync` silently re-resolves
      # whenever uv.lock disagrees with pyproject.toml, so an upstream major release
      # lands in CI the day it ships (mcp 2.0.0 broke an unchanged main this way).
      # With it, a stale lock fails the build with a clear message instead — re-run
      # `uv lock` and commit the result.
      - name: Sync (with dev extras, exact locked versions)
        run: uv sync --extra dev --locked
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
