[project]
name = "modelchoice-mcp"
version = "0.0.11"
description = "An open Model Context Protocol server for Vose Software's ModelChoice decision-tree add-in for Excel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vose Software" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
    "xlwings>=0.30",
]

[project.scripts]
modelchoice-mcp = "modelchoice_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelchoice_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
